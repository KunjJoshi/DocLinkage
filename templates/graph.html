<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://d3js.org/d3.v5.min.js"></script>
</head>
<style>
    /* style.css */

body{
    margin:10px;
    padding: 20px;

}
#graph-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    flex-direction: column;
    padding: 30px;
}

.node {
    text-align: center;
    background-color: #a9f4a3;
    border: 2px solid #333;
    padding: 10px;
    margin: 10px;
    box-shadow: 5px 0 #000;
    border-radius: 50%;
    cursor: pointer;
}

.center-node{
    text-align: center;
    background-color: #f9f787;
    border: 2px solid #333;
    padding: 10px;
    margin: 25px;
    box-shadow: 5px 0 #000;
    border-radius: 50%;
    cursor: pointer;
}

.node:hover .commondata {
    display: block;
    background-color: #fff;
}

.score {
    font-weight: bold;
    color: #007bff;
}

.commondata {
    display: none;
    background-color: #fff;
    padding: 10px;
    border: 1px solid #ccc;
}

</style>
<body>
    <svg width="800" height="600"></svg>
    <script>
const data = JSON.parse('{{ data | tojson | safe }}')
console.log(data);
var width = 800;
var height = 600;

var svg = d3.select("svg");
var centralNode = svg.append("circle")
            .attr("r", 50) // Radius of the central node
            .attr("cx", width / 2)
            .attr("cy", height / 2)
            .style("fill", "#4f6faf");
centralNode.append("text")
            .text(data.filename)
            .attr("text-anchor", "middle")
            .attr("dy", 5) // Adjust the vertical positioning
var nodes = svg.selectAll(".node")
             .data(data.results)
             .enter()
             .append("g")
             .attr("class", "node");
nodes.append("line")
  .attr("x1", width / 2)
  .attr("y1", height / 2)
  .attr("x2", function(d, i) {
    return (width / 2) + 100 * Math.cos((i / data.results.length) * 2 * Math.PI);
  })
  .attr("y2", function(d, i) {
    return (height / 2) + 100 * Math.sin((i / data.results.length) * 2 * Math.PI);
  })
  .style("stroke", "gray");

nodes.append("circle")
  .attr("r", 20) // Radius of the result nodes
  .attr("cx", function(d, i) {
    return (width / 2) + 100 * Math.cos((i / data.results.length) * 2 * Math.PI);
  })
  .attr("cy", function(d, i) {
    return (height / 2) + 100 * Math.sin((i / data.results.length) * 2 * Math.PI);
  })
  .style("fill", "#f7f98a");

  nodes.append("text")
  .text(function(d) {
    return d.file;
  })
  .attr("x", function(d, i) {
    return (width / 2) + 100 * Math.cos((i / data.results.length) * 2 * Math.PI);
  })
  .attr("y", function(d, i) {
    return (height / 2) + 100 * Math.sin((i / data.results.length) * 2 * Math.PI);
  })
  .attr("text-anchor", "middle")
  .attr("dy", 5);

nodes.on("mouseover", function(d) {
  // Display content in a list
  var contentList = d3.select("#content-list");
  contentList.html(""); // Clear the previous content
  contentList.append("p").text("Content:");
  d.content.forEach(function(item) {
    contentList.append("p").text(item);
  });
});
    </script>
</body>
</html>
