<!DOCTYPE html>
<html>
<head>
    <title>Homepage</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            padding: 20px;
            background-color: #f2f2f2f2;
            font-family: Arial, sans-serif;
        }

        .title {
            font-size: 30px;
            font-weight: 400;
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .section {
            margin: auto;
            padding: 30px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
            display: flex;
            flex-direction: column;
        }
        .fullform{
            display: flex;
            flex-direction: column;
            margin: 10px;
            padding: 20px;
        }
        h2 {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        #file-input {
            display: none;
        }

        .drop-area {
            border: 2px dashed #ccc;
            border-radius: 5px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            margin: 10px;
            font-weight: bolder;
        }

        .drop-area:hover {
            background-color: #f7f7f7;
        }

        input[type="file"] {
            display: none;
        }

        input[type="submit"] {
            background-color: #6a64f1;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
            font-weight: bolder;
        }

        input[type="submit"]:hover {
            background-color: #5c58d9;
        }
    </style>
</head>
<body>
    <div class="title">
        <h1>File Upload Section</h1>
    </div>

    {% if msg %}
    <h2>{{msg}}</h2>
    {% endif %}

    <div class="section">
        <form method="POST" action="/find-similar" enctype="multipart/form-data" class="fullform">
            <h2>Upload File Here to Check Similarity</h2>
            
            <label for="file-input" class="drop-area">
                Drag and drop a file here or click to browse.
            </label>
            <input type="file" name="filename" id="file-input">
            
            <input type="submit" value="Check">
        </form>
    </div>
</body>
</html>
